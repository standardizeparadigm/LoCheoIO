<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" role="img" aria-label="Vì sao dấu tiếng Việt biến mất: một ô cắt đúng bằng hộp dòng cắt cụt đỉnh dấu, chữ «CỔ ĐIỂN» đọc thành «CỔ ĐIÊN»; nới ô cắt thêm 0.24em thì dấu còn nguyên (v1.1.8 vòng 11)">
  <defs>
    <linearGradient id="bg11" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#08201f"/>
      <stop offset="0.55" stop-color="#0b2b2b"/>
      <stop offset="1" stop-color="#06191a"/>
    </linearGradient>
    <linearGradient id="frame11" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17494a"/>
      <stop offset="1" stop-color="#0d3536"/>
    </linearGradient>
    <linearGradient id="cut11" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e63b2e"/>
      <stop offset="1" stop-color="#f5a81c"/>
    </linearGradient>
    <linearGradient id="safe11" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b6e07a"/>
      <stop offset="1" stop-color="#7fd3a1"/>
    </linearGradient>
    <radialGradient id="bloom11" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#b6e07a" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#b6e07a" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow11" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="soft11" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>

  <rect width="1200" height="460" fill="url(#bg11)"/>

  <!-- ============ title ============ -->
  <text x="60" y="60" fill="#f4e3c2" font-family="Bungee, Verdana, sans-serif" font-size="25" letter-spacing="1.4">MỘT Ô CẮT · HAI KẾT QUẢ</text>
  <text x="60" y="86" fill="#8fb7a8" font-family="Verdana, sans-serif" font-size="12.5">v1.1.8 · vòng 11 — dấu chồng trên một chữ cần ~0.35em phía trên chiều cao in hoa</text>
  <line x1="60" y1="104" x2="1140" y2="104" stroke="#1c4a49" stroke-width="1.5"/>

  <!-- ============ LEFT: the bug ============ -->
  <rect x="56" y="126" width="508" height="272" rx="18" fill="url(#frame11)" stroke="#7a2b22" stroke-width="2"/>
  <text x="80" y="160" fill="#e68b7e" font-family="Verdana, sans-serif" font-size="12.5" font-weight="bold">TRƯỚC — truncate</text>
  <text x="80" y="181" fill="#9d6f66" font-family="Verdana, sans-serif" font-size="10.5">overflow: hidden · line-height 1.0em</text>

  <!-- chip mock -->
  <rect x="84" y="218" width="452" height="38" rx="6" fill="#0a2324" stroke="#2c6161" stroke-width="3"/>
  <circle cx="102" cy="237" r="4" fill="#f5a81c">
    <animate attributeName="opacity" values="1;0.35;1" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <text x="118" y="240" fill="#5f9b8d" font-family="Verdana, sans-serif" font-size="8.5" font-weight="bold" letter-spacing="1.6">CHẾ ĐỘ CHƠI</text>
  <text x="222" y="242" fill="#f5a81c" font-family="Bungee, Verdana, sans-serif" font-size="14">MUỐI DƯA CỔ ĐIÊN</text>

  <!-- the tight clip box: its top edge runs through the marks -->
  <rect x="84" y="227" width="452" height="26" rx="3" fill="none" stroke="url(#cut11)" stroke-width="1.8" stroke-dasharray="6 5">
    <animate attributeName="stroke-dashoffset" values="0;-22" dur="1.6s" repeatCount="indefinite"/>
  </rect>
  <text x="84" y="211" fill="#e66b5c" font-family="Verdana, sans-serif" font-size="9.5">ô cắt = hộp dòng → đường cắt chạy ngay trên đỉnh mũ</text>

  <!-- detail: Ể crossed out, Ê is what is left -->
  <text x="104" y="306" fill="#f5a81c" font-family="Bungee, Verdana, sans-serif" font-size="40" opacity="0.9">Ể</text>
  <line x1="96" y1="281" x2="142" y2="281" stroke="#e63b2e" stroke-width="3" stroke-linecap="round">
    <animate attributeName="opacity" values="0.2;1;0.2" dur="2.6s" repeatCount="indefinite"/>
  </line>
  <text x="102" y="326" fill="#8a5a52" font-family="Verdana, sans-serif" font-size="9.5">bị cắt</text>

  <text x="170" y="304" fill="#9d6f66" font-family="Verdana, sans-serif" font-size="20">→</text>

  <text x="206" y="306" fill="#f5a81c" font-family="Bungee, Verdana, sans-serif" font-size="40">Ê</text>
  <text x="204" y="326" fill="#8a5a52" font-family="Verdana, sans-serif" font-size="9.5">còn lại</text>

  <text x="286" y="292" fill="#c98d84" font-family="Verdana, sans-serif" font-size="10.5">mũ + dấu sắc chồng lên nhau</text>
  <text x="286" y="310" fill="#c98d84" font-family="Verdana, sans-serif" font-size="10.5">⇒ đỉnh mũ cao hơn trần chữ 0.35em</text>
  <text x="286" y="328" fill="#9d6f66" font-family="Verdana, sans-serif" font-size="10.5">«CỔ ĐIỂN» đọc thành «CỔ ĐIÊN»</text>

  <g>
    <rect x="84" y="352" width="150" height="26" rx="13" fill="#3a1512" stroke="#7a2b22"/>
    <text x="159" y="369" fill="#e68b7e" font-family="Verdana, sans-serif" font-size="10.5" text-anchor="middle">mất dấu · ảnh chụp 11</text>
  </g>

  <!-- arrow between panels -->
  <g>
    <line x1="576" y1="266" x2="612" y2="266" stroke="#b6e07a" stroke-width="3" stroke-linecap="round"/>
    <path d="M614 266 l-9 -6 v12 z" fill="#b6e07a"/>
    <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/>
  </g>

  <!-- ============ RIGHT: the fix ============ -->
  <rect x="628" y="126" width="516" height="272" rx="18" fill="url(#frame11)" stroke="#2f7a4f" stroke-width="2"/>
  <text x="652" y="160" fill="#b6e07a" font-family="Verdana, sans-serif" font-size="12.5" font-weight="bold">SAU — clip-safe</text>
  <text x="652" y="181" fill="#7fae95" font-family="Verdana, sans-serif" font-size="10.5">padding-block .24em · margin-block −.24em</text>

  <!-- padded clip box, taller than the ink -->
  <rect x="656" y="216" width="460" height="62" rx="8" fill="none" stroke="url(#safe11)" stroke-width="1.8" stroke-dasharray="6 5">
    <animate attributeName="stroke-dashoffset" values="22;0" dur="1.6s" repeatCount="indefinite"/>
  </rect>
  <text x="656" y="212" fill="#8fd0a0" font-family="Verdana, sans-serif" font-size="9.5">ô cắt nới ±0.24em — dấu nằm gọn bên trong</text>

  <rect x="656" y="228" width="448" height="38" rx="6" fill="#0a2324" stroke="#2c6161" stroke-width="3"/>
  <circle cx="674" cy="247" r="4" fill="#f5a81c">
    <animate attributeName="opacity" values="1;0.35;1" dur="2.4s" begin="0.6s" repeatCount="indefinite"/>
  </circle>
  <text x="690" y="250" fill="#5f9b8d" font-family="Verdana, sans-serif" font-size="8.5" font-weight="bold" letter-spacing="1.6">CHẾ ĐỘ CHƠI</text>
  <text x="794" y="252" fill="#f5a81c" font-family="Bungee, Verdana, sans-serif" font-size="14">MUỐI DƯA CỔ ĐIỂN</text>

  <circle cx="712" cy="322" r="58" fill="url(#bloom11)">
    <animate attributeName="r" values="50;62;50" dur="3.6s" repeatCount="indefinite"/>
  </circle>
  <text x="676" y="338" fill="#f5a81c" font-family="Bungee, Verdana, sans-serif" font-size="40" filter="url(#glow11)">Ể</text>
  <text x="680" y="358" fill="#9ad0a8" font-family="Verdana, sans-serif" font-size="9.5">đủ dấu</text>

  <text x="760" y="298" fill="#8fb7a8" font-family="Verdana, sans-serif" font-size="10.5">hộp dòng 1.5em ⇒ không đường cắt nào chạm vào dấu</text>
  <text x="760" y="316" fill="#8fb7a8" font-family="Verdana, sans-serif" font-size="10.5">buộc phải cắt chữ thì kế hoạch cắt chuỗi</text>
  <text x="760" y="334" fill="#8fb7a8" font-family="Verdana, sans-serif" font-size="10.5">trước khi vẽ — không dùng overflow</text>

  <g>
    <rect x="924" y="344" width="180" height="26" rx="13" fill="#0f3324" stroke="#2f7a4f"/>
    <text x="1014" y="361" fill="#b6e07a" font-family="Verdana, sans-serif" font-size="10.5" text-anchor="middle">cả 19 chữ · đủ dấu</text>
  </g>

  <!-- ============ footer ============ -->
  <line x1="60" y1="420" x2="1140" y2="420" stroke="#1c4a49" stroke-width="1"/>
  <text x="60" y="440" fill="#4f7a6f" font-family="Verdana, sans-serif" font-size="9.5">tests/diacritics-clip.test.ts (15) · .clip-safe trong src/index.css · chip dùng chipBoxHeight() để hàng xóm đọc số đo thật</text>
</svg>
