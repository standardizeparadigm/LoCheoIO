<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-label="Chip chế độ của Lọ Chéo 1.1.8 — trước: chip căn giữa trên mascot ở mép phải nên bị overflow hidden cắt mất nửa phải; sau: căn theo mép trong và có trần bề rộng, kèm thang bậc nhãn → cỡ chữ → ellipsis">
  <title>Chip chế độ — vì sao nó mất nửa bên phải, và cách sửa (v1.1.8 vòng 10)</title>

  <defs>
    <linearGradient id="chip-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b2b2b"/>
      <stop offset="1" stop-color="#061a1a"/>
    </linearGradient>
    <linearGradient id="chip-band" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#123c37"/>
      <stop offset="0.85" stop-color="#0f332e"/>
      <stop offset="1" stop-color="#123c37"/>
    </linearGradient>
    <linearGradient id="chip-face-good" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0b2b2b"/>
      <stop offset="1" stop-color="#0d3a33"/>
    </linearGradient>
    <linearGradient id="chip-face-bad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2a1113"/>
      <stop offset="1" stop-color="#3a161a"/>
    </linearGradient>
    <linearGradient id="chip-ladder" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b6e07a"/>
      <stop offset="0.55" stop-color="#f5a81c"/>
      <stop offset="1" stop-color="#e63b2e"/>
    </linearGradient>
    <filter id="chip-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="chip-soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="chip-hero-clip-before">
      <rect x="40" y="120" width="520" height="180" rx="10"/>
    </clipPath>
  </defs>

  <rect width="1200" height="620" fill="url(#chip-bg)"/>
  <g opacity="0.08" fill="#b6e07a">
    <rect x="0" y="0" width="1200" height="1"/>
    <rect x="0" y="120" width="1200" height="1"/>
    <rect x="0" y="240" width="1200" height="1"/>
    <rect x="0" y="360" width="1200" height="1"/>
    <rect x="0" y="480" width="1200" height="1"/>
    <rect x="0" y="600" width="1200" height="1"/>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <text x="40" y="52" fill="#f4e3c2" font-size="26" font-weight="700">chip chế độ · planModeChip()</text>
    <text x="40" y="78" fill="#8fd0b8" font-size="14">căn theo MÉP TRONG khi mascot ở phải · trần bề rộng = band − 2×8 · thang bậc quyết định trước khi vẽ</text>

    <!-- ================= BEFORE ================= -->
    <g>
      <text x="40" y="112" fill="#f7c9c2" font-size="14" font-weight="700">TRƯỚC · centre trên mascot ở mép phải → overflow: hidden cắt</text>

      <rect x="40" y="120" width="520" height="180" rx="10" fill="url(#chip-band)" stroke="#1d5c52" stroke-width="1.5"/>

      <!-- mascot -->
      <g transform="translate(478 196)">
        <ellipse cx="0" cy="52" rx="46" ry="9" fill="#06211d" opacity="0.7"/>
        <rect x="-34" y="-26" width="68" height="70" rx="14" fill="#e3c9a1" opacity="0.9"/>
        <rect x="-26" y="-34" width="52" height="14" rx="6" fill="#c9a273"/>
        <circle cx="-12" cy="4" r="4" fill="#0b2b2b"/>
        <circle cx="12" cy="4" r="4" fill="#0b2b2b"/>
        <path d="M-9 18 q9 8 18 0" stroke="#0b2b2b" stroke-width="3" fill="none" stroke-linecap="round"/>
      </g>

      <!-- the chip, drawn in the full width and clipped by the band -->
      <g clip-path="url(#chip-hero-clip-before)">
        <g>
          <rect x="196" y="252" width="300" height="40" rx="4" fill="url(#chip-face-bad)" stroke="#e63b2e" stroke-width="3"/>
          <circle cx="216" cy="272" r="5" fill="#f5a81c"/>
          <text x="232" y="277" fill="#7ea79a" font-size="11" font-weight="700" letter-spacing="2">CHẾ ĐỘ CHƠI</text>
          <text x="330" y="278" fill="#f5a81c" font-size="13">MUỐI DƯA CỔ</text>
          <animate attributeName="opacity" values="1;1;0.55;1" keyTimes="0;0.6;0.75;1" dur="6s" repeatCount="indefinite"/>
        </g>
      </g>

      <!-- the cut -->
      <line x1="560" y1="248" x2="560" y2="296" stroke="#e63b2e" stroke-width="2" stroke-dasharray="5 4">
        <animate attributeName="opacity" values="1;0.2;1" dur="1.6s" repeatCount="indefinite"/>
      </line>
      <text x="470" y="316" fill="#e63b2e" font-size="11">biên band — phần này MẤT</text>

      <text x="40" y="336" fill="#f7c9c2" font-size="12">left: 50% · translateX(-50%) · không có max-width → nửa chip nằm ngoài</text>
    </g>

    <!-- ================= AFTER ================= -->
    <g>
      <text x="620" y="112" fill="#b6e07a" font-size="14" font-weight="700">SAU · căn mép trong + trần bề rộng → không thể tràn</text>

      <rect x="620" y="120" width="520" height="180" rx="10" fill="url(#chip-band)" stroke="#1d5c52" stroke-width="1.5"/>

      <g transform="translate(1052 196)">
        <ellipse cx="0" cy="52" rx="46" ry="9" fill="#06211d" opacity="0.7"/>
        <rect x="-34" y="-26" width="68" height="70" rx="14" fill="#e3c9a1" opacity="0.9"/>
        <rect x="-26" y="-34" width="52" height="14" rx="6" fill="#c9a273"/>
        <circle cx="-12" cy="4" r="4" fill="#0b2b2b"/>
        <circle cx="12" cy="4" r="4" fill="#0b2b2b"/>
        <path d="M-9 18 q9 8 18 0" stroke="#0b2b2b" stroke-width="3" fill="none" stroke-linecap="round"/>
      </g>

      <g filter="url(#chip-glow)">
        <rect x="770" y="252" width="300" height="40" rx="4" fill="url(#chip-face-good)" stroke="#b6e07a" stroke-width="3"/>
        <circle cx="790" cy="272" r="5" fill="#f5a81c">
          <animate attributeName="r" values="5;6.5;5" dur="2.4s" repeatCount="indefinite"/>
        </circle>
        <text x="806" y="277" fill="#7ea79a" font-size="11" font-weight="700" letter-spacing="2">CHẾ ĐỘ CHƠI</text>
        <text x="906" y="278" fill="#f5a81c" font-size="13">MUỐI DƯA CỔ ĐIỂN</text>
      </g>
      <rect x="770" y="252" width="300" height="40" rx="4" fill="none" stroke="#b6e07a" stroke-width="1.5" opacity="0.5">
        <animate attributeName="opacity" values="0.5;0.15;0.5" dur="3s" repeatCount="indefinite"/>
      </rect>

      <text x="620" y="336" fill="#a9e6c9" font-size="12">right: 0 · max-width: band − 2×8 = 1072px · needed 246px</text>
    </g>

    <!-- ================= LADDER ================= -->
    <g transform="translate(40 372)">
      <text x="0" y="0" fill="#f4e3c2" font-size="15" font-weight="700">thang bậc khi band hẹp dần</text>

      <g font-size="12">
        <g transform="translate(0 18)">
          <rect width="270" height="34" rx="4" fill="#0f332e" stroke="url(#chip-ladder)" stroke-width="1.4"/>
          <circle cx="16" cy="17" r="4" fill="#f5a81c"/>
          <text x="28" y="21" fill="#d8f5e4">CHẾ ĐỘ CHƠI  MUỐI DƯA CỔ ĐIỂN</text>
          <text x="200" y="21" fill="#b6e07a">full</text>
        </g>
        <g transform="translate(290 18)">
          <rect width="270" height="34" rx="4" fill="#0f332e" stroke="url(#chip-ladder)" stroke-width="1.4"/>
          <circle cx="16" cy="17" r="4" fill="#f5a81c"/>
          <text x="28" y="21" fill="#d8f5e4">MUỐI DƯA CỔ ĐIỂN</text>
          <text x="180" y="21" fill="#f5a81c">label-dropped</text>
          <rect x="22" y="14" width="96" height="2" fill="#e63b2e">
            <animate attributeName="width" values="0;0;96;96" keyTimes="0;0.2;0.5;1" dur="7s" repeatCount="indefinite"/>
          </rect>
        </g>
        <g transform="translate(580 18)">
          <rect width="270" height="34" rx="4" fill="#0f332e" stroke="url(#chip-ladder)" stroke-width="1.4"/>
          <circle cx="16" cy="17" r="4" fill="#f5a81c"/>
          <text x="28" y="21" fill="#d8f5e4" font-size="10">MUỐI DƯA CỔ ĐIỂN</text>
          <text x="170" y="21" fill="#f5a81c">name-shrunk</text>
        </g>
        <g transform="translate(870 18)">
          <rect width="270" height="34" rx="4" fill="#0f332e" stroke="url(#chip-ladder)" stroke-width="1.4"/>
          <circle cx="16" cy="17" r="4" fill="#f5a81c"/>
          <text x="28" y="21" fill="#d8f5e4" font-size="10">MUỐI DƯA CỔ ĐIỂ…</text>
          <text x="186" y="21" fill="#e63b2e">ellipsis</text>
        </g>
      </g>
    </g>

    <!-- ================= NUMBERS ================= -->
    <g transform="translate(40 476)">
      <rect width="1120" height="90" rx="10" fill="#0f332e" stroke="#2f7d6a"/>
      <text x="18" y="26" fill="#f4e3c2" font-size="13" font-weight="700">đo được</text>
      <text x="18" y="48" fill="#8fd0b8" font-size="12">1280×720 → band 1088 · khả dụng 1072 · cần 246 → full</text>
      <text x="18" y="66" fill="#8fd0b8" font-size="12">320×480  → band 288 · khả dụng 272 · cần 246 → full (còn 26px)</text>
      <text x="18" y="84" fill="#f7c9c2" font-size="12">band 128 → khả dụng 112 → ellipsis ở sàn 9.5px</text>

      <text x="700" y="26" fill="#f4e3c2" font-size="13" font-weight="700">bất biến</text>
      <text x="700" y="48" fill="#8fd0b8" font-size="12">chip-name-survives · chip-labelled</text>
      <text x="700" y="66" fill="#8fd0b8" font-size="12">12 → 14 bất biến · 21 preset</text>
      <text x="700" y="84" fill="#8fd0b8" font-size="12">corpus 189 ảnh chụp (21 × 9)</text>
    </g>

    <g transform="translate(40 596)">
      <rect width="1120" height="1" fill="#1d5c52"/>
      <text x="0" y="18" fill="#8fd0b8" font-size="11">Lọ Chéo v1.1.8 · vòng 10 · src/components/menu/adaptive/chip/ · tests/mode-chip.test.ts (23)</text>
    </g>
  </g>
</svg>
