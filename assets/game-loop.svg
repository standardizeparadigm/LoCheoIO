<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-label="Lọ Chéo v1.1.8 — một nhập đoạn: GIỮ hai phím, LƯỢN chéo, CHÉM mốc ruồi sâu, HỨNG đầy hũ, CỘNG ĐIỂM combo — vòng lặp vô hạn (hoạt họa SMIL)">
  <defs>
    <linearGradient id="glBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b2b2b"/>
      <stop offset="0.55" stop-color="#0e3430"/>
      <stop offset="1" stop-color="#123f38"/>
    </linearGradient>
    <linearGradient id="glCard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14443d"/>
      <stop offset="1" stop-color="#0d332e"/>
    </linearGradient>
    <linearGradient id="glBrine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b6e07a"/>
      <stop offset="1" stop-color="#8fc94f"/>
    </linearGradient>
    <linearGradient id="glTurm" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f5a81c"/>
      <stop offset="1" stop-color="#e63b2e"/>
    </linearGradient>
    <linearGradient id="glJar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4e3c2"/>
      <stop offset="1" stop-color="#d9c39a"/>
    </linearGradient>
    <filter id="glGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glSoft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <marker id="glArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#b6e07a"/>
    </marker>
  </defs>

  <rect width="1200" height="430" fill="url(#glBg)"/>
  <!-- san gach manh, tinh -->
  <g opacity="0.14" stroke="#b6e07a" stroke-width="1">
    <path d="M0 402 H1200 M0 416 H1200 M150 402 V416 M450 402 V416 M750 402 V416 M1050 402 V416"/>
  </g>

  <text x="44" y="46" font-family="'Arial Black','Bungee',sans-serif" font-weight="900" font-size="21" letter-spacing="3" fill="#f4e3c2">MỘT NHẬP ĐOẠN</text>
  <text x="44" y="68" font-family="Verdana, sans-serif" font-size="12" fill="#7d9d94">giữ · lượn · chém · hứng — rồi lặp lại, cho đến khi gốm nứt làm ba</text>
  <text x="1156" y="46" text-anchor="end" font-family="Verdana, sans-serif" font-size="11" fill="#b6e07a" opacity="0.8">v1.1.8</text>

  <!-- vong lap: hanh trinh diem sang chay theo bon buoc -->
  <g fill="none" stroke="#b6e07a" stroke-width="2.5" stroke-dasharray="9 7" marker-end="url(#glArrow)">
    <path d="M302 210 H314" opacity="0.9">
      <animate attributeName="stroke-opacity" values="0.35;0.95;0.35" dur="2.4s" begin="0s" repeatCount="indefinite"/>
    </path>
    <path d="M582 210 H594" opacity="0.9">
      <animate attributeName="stroke-opacity" values="0.35;0.95;0.35" dur="2.4s" begin="0.6s" repeatCount="indefinite"/>
    </path>
    <path d="M862 210 H874" opacity="0.9">
      <animate attributeName="stroke-opacity" values="0.35;0.95;0.35" dur="2.4s" begin="1.2s" repeatCount="indefinite"/>
    </path>
    <!-- quanh lai: buoc 4 tro ve buoc 1 -->
    <path d="M1012 126 V100 Q1012 94 1006 94 H178 Q172 94 172 100 V124" opacity="0.9">
      <animate attributeName="stroke-opacity" values="0.35;0.95;0.35" dur="2.4s" begin="1.8s" repeatCount="indefinite"/>
    </path>
  </g>
  <!-- mot cham nho chay tren duong quay lai, nho buoc 4 -> buoc 1 -->
  <circle r="4.5" fill="#f5a81c" filter="url(#glGlow)">
    <animateMotion path="M1012 126 V100 Q1012 94 1006 94 H178 Q172 94 172 100 V124" dur="2.4s" begin="0s" repeatCount="indefinite"/>
  </circle>

  <!-- BUOC 1: GIU -->
  <g>
    <rect x="44" y="130" width="256" height="160" rx="14" fill="url(#glCard)" stroke="#2b5a51" stroke-width="1.5"/>
    <rect x="44" y="130" width="256" height="160" rx="14" fill="none" stroke="#b6e07a" stroke-width="2.5" filter="url(#glSoft)" opacity="0.35">
      <animate attributeName="opacity" values="0.1;0.75;0.1" dur="2.4s" begin="0s" repeatCount="indefinite"/>
    </rect>
    <rect x="44" y="130" width="256" height="160" rx="14" fill="none" stroke="#b6e07a" stroke-width="2">
      <animate attributeName="stroke-opacity" values="0.25;1;0.25" dur="2.4s" begin="0s" repeatCount="indefinite"/>
    </rect>
    <circle cx="80" cy="166" r="14" fill="url(#glTurm)"/>
    <text x="80" y="171" text-anchor="middle" font-family="'Arial Black',sans-serif" font-weight="900" font-size="13" fill="#fff">1</text>
    <text x="104" y="172" font-family="'Arial Black',sans-serif" font-weight="900" font-size="14" letter-spacing="2" fill="#f4e3c2">GIỮ 2 PHÍM</text>
    <g font-family="Verdana, sans-serif" font-size="10.5" fill="#c8d8b0">
      <text x="64" y="200">phím trái + phím phải cùng lúc,</text>
      <text x="64" y="216">lọ nghiêng mình đi đường CHÉO —</text>
      <text x="64" y="232">thả một phím để quay lại</text>
    </g>
    <g font-family="monospace" font-size="10" fill="#7d9d94">
      <rect x="64" y="248" width="46" height="20" rx="4" fill="#0b2b2b" stroke="#2b5a51"/>
      <text x="70" y="262">← A</text>
      <rect x="118" y="248" width="46" height="20" rx="4" fill="#0b2b2b" stroke="#2b5a51"/>
      <text x="124" y="262">D →</text>
      <text x="176" y="262" fill="#b6e07a">= nghiêng CHÉO</text>
    </g>
  </g>

  <!-- BUOC 2: LUON & CHEM -->
  <g>
    <rect x="324" y="130" width="256" height="160" rx="14" fill="url(#glCard)" stroke="#2b5a51" stroke-width="1.5"/>
    <rect x="324" y="130" width="256" height="160" rx="14" fill="none" stroke="#f5a81c" stroke-width="2">
      <animate attributeName="stroke-opacity" values="0.25;1;0.25" dur="2.4s" begin="0.6s" repeatCount="indefinite"/>
    </rect>
    <circle cx="360" cy="166" r="14" fill="url(#glTurm)"/>
    <text x="360" y="171" text-anchor="middle" font-family="'Arial Black',sans-serif" font-weight="900" font-size="13" fill="#fff">2</text>
    <text x="384" y="172" font-family="'Arial Black',sans-serif" font-weight="900" font-size="14" letter-spacing="2" fill="#f4e3c2">LƯỢN &amp; CHÉM</text>
    <g font-family="Verdana, sans-serif" font-size="10.5" fill="#c8d8b0">
      <text x="344" y="200">tăng tốc đâm tan mốc, ruồi,</text>
      <text x="344" y="216">sâu rau — đấy là nêm muối</text>
      <text x="344" y="232">gây vết nứt, đừng hứng</text>
    </g>
    <g>
      <rect x="344" y="246" width="26" height="18" rx="3" fill="#7a5c8a"/>
      <rect x="376" y="246" width="26" height="18" rx="3" fill="#5c8a7a"/>
      <rect x="408" y="246" width="26" height="18" rx="3" fill="#8a5c5c"/>
      <line x1="340" y1="268" x2="446" y2="242" stroke="#f5a81c" stroke-width="2.5" stroke-linecap="round">
        <animate attributeName="stroke-opacity" values="0.2;1;0.2" dur="0.8s" begin="0s" repeatCount="indefinite"/>
      </line>
      <text x="452" y="262" font-family="Verdana, sans-serif" font-size="10" fill="#e63b2e">chém!</text>
    </g>
  </g>

  <!-- BUOC 3: HUNG -->
  <g>
    <rect x="604" y="130" width="256" height="160" rx="14" fill="url(#glCard)" stroke="#2b5a51" stroke-width="1.5"/>
    <rect x="604" y="130" width="256" height="160" rx="14" fill="none" stroke="#b6e07a" stroke-width="2">
      <animate attributeName="stroke-opacity" values="0.25;1;0.25" dur="2.4s" begin="1.2s" repeatCount="indefinite"/>
    </rect>
    <circle cx="640" cy="166" r="14" fill="url(#glTurm)"/>
    <text x="640" y="171" text-anchor="middle" font-family="'Arial Black',sans-serif" font-weight="900" font-size="13" fill="#fff">3</text>
    <text x="664" y="172" font-family="'Arial Black',sans-serif" font-weight="900" font-size="14" letter-spacing="2" fill="#f4e3c2">HỨNG ĐẦY HŨ</text>
    <g font-family="Verdana, sans-serif" font-size="10.5" fill="#c8d8b0">
      <text x="624" y="200">hứng nước muối trong lành</text>
      <text x="624" y="216">đầy miệng hũ trước khi</text>
      <text x="624" y="232">vết nứt thứ ba xuất hiện</text>
    </g>
    <!-- hu gom: muc nuoc day dan -->
    <g>
      <path d="M690 244 h64 l-8 34 h-48 z" fill="none" stroke="url(#glJar)" stroke-width="2.5"/>
      <rect x="686" y="240" width="72" height="6" rx="3" fill="url(#glJar)"/>
      <clipPath id="glJarClip"><path d="M692 248 h60 l-7 28 h-46 z"/></clipPath>
      <rect x="688" y="252" width="68" height="26" fill="url(#glBrine)" opacity="0.85" clip-path="url(#glJarClip)">
        <animate attributeName="y" values="278;254;278" dur="2.4s" begin="1.2s" repeatCount="indefinite"/>
      </rect>
      <circle cx="700" cy="236" r="2.6" fill="#b6e07a">
        <animate attributeName="cy" values="236;252" dur="1.2s" begin="1.2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="1;0" dur="1.2s" begin="1.2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="724" cy="234" r="2.6" fill="#b6e07a">
        <animate attributeName="cy" values="234;250" dur="1.2s" begin="1.5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="1;0" dur="1.2s" begin="1.5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="748" cy="237" r="2.6" fill="#b6e07a">
        <animate attributeName="cy" values="237;253" dur="1.2s" begin="1.8s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="1;0" dur="1.2s" begin="1.8s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>

  <!-- BUOC 4: CONG DIEM -->
  <g>
    <rect x="884" y="130" width="256" height="160" rx="14" fill="url(#glCard)" stroke="#2b5a51" stroke-width="1.5"/>
    <rect x="884" y="130" width="256" height="160" rx="14" fill="none" stroke="#f4e3c2" stroke-width="2">
      <animate attributeName="stroke-opacity" values="0.25;1;0.25" dur="2.4s" begin="1.8s" repeatCount="indefinite"/>
    </rect>
    <circle cx="920" cy="166" r="14" fill="url(#glTurm)"/>
    <text x="920" y="171" text-anchor="middle" font-family="'Arial Black',sans-serif" font-weight="900" font-size="13" fill="#fff">4</text>
    <text x="944" y="172" font-family="'Arial Black',sans-serif" font-weight="900" font-size="14" letter-spacing="2" fill="#f4e3c2">CỘNG ĐIỂM</text>
    <g font-family="Verdana, sans-serif" font-size="10.5" fill="#c8d8b0">
      <text x="904" y="200">combo càng dài hệ số càng</text>
      <text x="904" y="216">lớn — mỗi chế độ có một</text>
      <text x="904" y="232">hệ số riêng (×0.5 → ×2.0)</text>
    </g>
    <g font-family="'Courier New',monospace" font-weight="700" font-size="13">
      <text x="904" y="262" fill="#b6e07a">+1 250</text>
      <text x="980" y="262" fill="#f5a81c">
        ×1.5
        <animate attributeName="opacity" values="0.4;1;0.4" dur="1.2s" begin="1.8s" repeatCount="indefinite"/>
      </text>
      <text x="1054" y="262" fill="#f4e3c2" font-size="10" opacity="0.8">combo 12</text>
    </g>
  </g>

  <!-- chan do: vong lap dong lai -->
  <text x="600" y="386" text-anchor="middle" font-family="Verdana, sans-serif" font-size="11.5" fill="#7d9d94">quay lại bước 1 — hũ còn nguyên thì nhịp chưa dừng · gốm nứt làm ba là kết thúc</text>
  <text x="44" y="386" font-family="Verdana, sans-serif" font-size="10" fill="#b6e07a" opacity="0.75">hoạt họa SMIL — chảy chậm, không JS</text>
</svg>
