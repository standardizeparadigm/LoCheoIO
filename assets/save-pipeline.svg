<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-label="Lọ Chéo v1.1.8 — đường đi của một ván: engine kết thúc ván → storage/ 9 module qua safeStorage → hợp nhất và cứu dữ liệu → bảng vàng TOP 8, thành tựu, cài đặt — hết localStorage thì hết dự án (hoạt họa SMIL)">
  <defs>
    <linearGradient id="spBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b2b2b"/>
      <stop offset="0.6" stop-color="#0e3430"/>
      <stop offset="1" stop-color="#123f38"/>
    </linearGradient>
    <linearGradient id="spNode" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14443d"/>
      <stop offset="1" stop-color="#0d332e"/>
    </linearGradient>
    <linearGradient id="spBrine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b6e07a"/>
      <stop offset="1" stop-color="#8fc94f"/>
    </linearGradient>
    <linearGradient id="spTurm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f5a81c"/>
      <stop offset="1" stop-color="#e63b2e"/>
    </linearGradient>
    <linearGradient id="spClay" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4e3c2"/>
      <stop offset="1" stop-color="#d9c39a"/>
    </linearGradient>
    <filter id="spGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="spSoft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <marker id="spArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#b6e07a"/>
    </marker>
    <marker id="spArrowT" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#f5a81c"/>
    </marker>
  </defs>

  <rect width="1200" height="430" fill="url(#spBg)"/>
  <g opacity="0.14" stroke="#b6e07a" stroke-width="1">
    <path d="M0 402 H1200 M0 416 H1200 M200 402 V416 M600 402 V416 M1000 402 V416"/>
  </g>

  <text x="44" y="46" font-family="'Arial Black','Bungee',sans-serif" font-weight="900" font-size="21" letter-spacing="3" fill="#f4e3c2">ĐƯỜNG ĐI CỦA MỘT VÁN</text>
  <text x="44" y="68" font-family="Verdana, sans-serif" font-size="12" fill="#7d9d94">từ engine đến bảng vàng — hết localStorage thì hết dự án: không server, không đám mây, không CDN</text>
  <text x="1156" y="46" text-anchor="end" font-family="Verdana, sans-serif" font-size="11" fill="#b6e07a" opacity="0.8">v1.1.8</text>

  <!-- NUT 1: ENGINE -->
  <g>
    <rect x="44" y="120" width="230" height="150" rx="14" fill="url(#spNode)" stroke="#2b5a51" stroke-width="1.5"/>
    <rect x="44" y="120" width="230" height="150" rx="14" fill="none" stroke="#b6e07a" stroke-width="2">
      <animate attributeName="stroke-opacity" values="0.3;1;0.3" dur="3s" begin="0s" repeatCount="indefinite"/>
    </rect>
    <text x="64" y="152" font-family="'Arial Black',sans-serif" font-weight="900" font-size="14" letter-spacing="2" fill="#f4e3c2">ENGINE</text>
    <text x="64" y="172" font-family="Verdana, sans-serif" font-size="10.5" fill="#c8d8b0">kết thúc ván (hoặc thoát giữa ván)</text>
    <g font-family="Verdana, sans-serif" font-size="10" fill="#7d9d94">
      <text x="64" y="196">điểm · combo · hũ còn nguyên</text>
      <text x="64" y="212">thành tựu vừa mở · chế độ đã chơi</text>
      <text x="64" y="236" fill="#b6e07a">gói thành snapshot</text>
    </g>
    <rect x="64" y="244" width="120" height="18" rx="4" fill="#0b2b2b" stroke="#2b5a51"/>
    <text x="72" y="257" font-family="'Courier New',monospace" font-size="10" fill="#b6e07a">locheo.run.v1</text>
  </g>

  <path d="M276 195 H306" fill="none" stroke="#b6e07a" stroke-width="2.5" marker-end="url(#spArrow)">
    <animate attributeName="stroke-opacity" values="0.35;0.95;0.35" dur="3s" begin="0s" repeatCount="indefinite"/>
  </path>
  <circle r="4" fill="#f5a81c" filter="url(#spGlow)">
    <animateMotion path="M276 195 H306" dur="1s" begin="0s" repeatCount="indefinite"/>
  </circle>

  <!-- NUT 2: STORAGE -->
  <g>
    <rect x="310" y="120" width="230" height="150" rx="14" fill="url(#spNode)" stroke="#2b5a51" stroke-width="1.5"/>
    <rect x="310" y="120" width="230" height="150" rx="14" fill="none" stroke="#b6e07a" stroke-width="2">
      <animate attributeName="stroke-opacity" values="0.3;1;0.3" dur="3s" begin="1s" repeatCount="indefinite"/>
    </rect>
    <text x="330" y="152" font-family="'Arial Black',sans-serif" font-weight="900" font-size="14" letter-spacing="2" fill="#f4e3c2">STORAGE/</text>
    <text x="330" y="172" font-family="Verdana, sans-serif" font-size="10.5" fill="#c8d8b0">9 module con, chạm localStorage</text>
    <text x="330" y="188" font-family="Verdana, sans-serif" font-size="10.5" fill="#c8d8b0">đúng một lối: safeStorage</text>
    <g font-family="Verdana, sans-serif" font-size="10" fill="#7d9d94">
      <text x="330" y="212">JSON hỏng · quota đầy · tab ẩn</text>
      <text x="330" y="228">— hỏng ở đâu trả null ở đó,</text>
      <text x="330" y="244">không bao giờ ném lên gameplay</text>
    </g>
    <text x="330" y="262" font-family="'Courier New',monospace" font-size="10" fill="#f5a81c">try { getItem } catch → null</text>
  </g>

  <path d="M542 195 H572" fill="none" stroke="#b6e07a" stroke-width="2.5" marker-end="url(#spArrow)">
    <animate attributeName="stroke-opacity" values="0.35;0.95;0.35" dur="3s" begin="1s" repeatCount="indefinite"/>
  </path>
  <circle r="4" fill="#f5a81c" filter="url(#spGlow)">
    <animateMotion path="M542 195 H572" dur="1s" begin="1s" repeatCount="indefinite"/>
  </circle>

  <!-- NUT 3: HOP NHAT + CUU -->
  <g>
    <rect x="576" y="120" width="230" height="150" rx="14" fill="url(#spNode)" stroke="#2b5a51" stroke-width="1.5"/>
    <rect x="576" y="120" width="230" height="150" rx="14" fill="none" stroke="#f5a81c" stroke-width="2">
      <animate attributeName="stroke-opacity" values="0.3;1;0.3" dur="3s" begin="2s" repeatCount="indefinite"/>
    </rect>
    <text x="596" y="152" font-family="'Arial Black',sans-serif" font-weight="900" font-size="13" letter-spacing="1" fill="#f4e3c2">HỢP NHẬT + CỨU</text>
    <text x="596" y="172" font-family="Verdana, sans-serif" font-size="10.5" fill="#c8d8b0">đọc bản cũ, gộp bản mới</text>
    <g font-family="Verdana, sans-serif" font-size="10" fill="#7d9d94">
      <text x="596" y="196">cấu trúc lạ → bỏ, giữ mặc định</text>
      <text x="596" y="212">số âm / NaN → kẹp về biên an toàn</text>
      <text x="596" y="228">bản hỏng một mục → cứu từng mục</text>
      <text x="596" y="244">còn lại, không vứt cả bảng vàng</text>
    </g>
    <text x="596" y="262" font-family="'Courier New',monospace" font-size="10" fill="#b6e07a">normalise → clamp → merge</text>
  </g>

  <!-- ba nhanh den dich -->
  <g fill="none" stroke="#f5a81c" stroke-width="2" marker-end="url(#spArrowT)">
    <path d="M808 175 H856 Q862 175 862 181 V193">
      <animate attributeName="stroke-opacity" values="0.35;0.95;0.35" dur="3s" begin="2s" repeatCount="indefinite"/>
    </path>
    <path d="M808 195 H862">
      <animate attributeName="stroke-opacity" values="0.35;0.95;0.35" dur="3s" begin="2.2s" repeatCount="indefinite"/>
    </path>
    <path d="M808 215 H856 Q862 215 862 209 V197">
      <animate attributeName="stroke-opacity" values="0.35;0.95;0.35" dur="3s" begin="2.4s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- NUT 4: DICH -->
  <g>
    <rect x="866" y="120" width="290" height="150" rx="14" fill="url(#spNode)" stroke="#2b5a51" stroke-width="1.5"/>
    <rect x="866" y="120" width="290" height="150" rx="14" fill="none" stroke="#b6e07a" stroke-width="2">
      <animate attributeName="stroke-opacity" values="0.3;1;0.3" dur="3s" begin="2.6s" repeatCount="indefinite"/>
    </rect>
    <g font-family="'Arial Black',sans-serif" font-weight="900" font-size="11.5">
      <rect x="886" y="140" width="150" height="30" rx="6" fill="#0b2b2b" stroke="#b6e07a" stroke-width="1.2"/>
      <text x="898" y="160" fill="#b6e07a">BẢNG VÀNG TOP 8</text>
      <rect x="886" y="180" width="150" height="30" rx="6" fill="#0b2b2b" stroke="#f5a81c" stroke-width="1.2"/>
      <text x="898" y="200" fill="#f5a81c">THÀNH TỰU 16</text>
      <rect x="886" y="220" width="150" height="30" rx="6" fill="#0b2b2b" stroke="#f4e3c2" stroke-width="1.2"/>
      <text x="898" y="240" fill="#f4e3c2">CÀI ĐẶT v1</text>
    </g>
    <g font-family="Verdana, sans-serif" font-size="10" fill="#7d9d94">
      <text x="1050" y="160">điểm cao nhất mỗi chế độ</text>
      <text x="1050" y="200">16 huy hiệu, mở theo việc thật</text>
      <text x="1050" y="240">10 field, 6 mục UI, backup JSON</text>
    </g>
    <text x="886" y="266" font-family="Verdana, sans-serif" font-size="10" fill="#c8d8b0">mỗi thứ một key riêng — xoá một thứ không xoá hai thứ kia</text>
  </g>

  <!-- CHOI TIEP: duong nguoc -->
  <g>
    <path d="M310 292 H1160 Q1172 292 1172 304 V318 Q1172 330 1160 330 H310 Q298 330 298 318 V304 Q298 292 310 292" fill="none" stroke="#7d9d94" stroke-width="1.5" stroke-dasharray="6 6"/>
    <path d="M1160 292 H316" fill="none" stroke="#f4e3c2" stroke-width="2" marker-end="url(#spArrow)" opacity="0.9">
      <animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="2.6s" begin="0s" repeatCount="indefinite"/>
    </path>
    <circle r="4" fill="#f4e3c2" filter="url(#spGlow)">
      <animateMotion path="M1160 292 H316" dur="2.6s" begin="0s" repeatCount="indefinite"/>
    </circle>
    <text x="735" y="322" text-anchor="middle" font-family="Verdana, sans-serif" font-size="11" fill="#f4e3c2">CHƠI TIẾP ván dở — đọc lại locheo.run.v1 và đi đường ngược</text>
  </g>

  <text x="44" y="386" font-family="Verdana, sans-serif" font-size="10" fill="#b6e07a" opacity="0.75">hoạt họa SMIL — chảy chậm, không JS · mọi key liệt kê trong docs/guides/storage-keys.md</text>
  <text x="1156" y="386" text-anchor="end" font-family="Verdana, sans-serif" font-size="10" fill="#7d9d94">xoá dữ liệu ở mục CÀI ĐẶT sẽ đi đúng đường này và dừng ở storage/</text>
</svg>
