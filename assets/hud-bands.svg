<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-label="HUD bands của Lọ Chéo 1.1.8 — mỗi readout một băng glyph, cột giữa chảy từ đồng hồ, bậc thang bỏ dần chips → combo bar → jars → best, rồi nén tới sàn 0.55">
  <title>planHud() — băng glyph, cột chảy, bậc thang bỏ dần (v1.1.8)</title>

  <defs>
    <linearGradient id="hud-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b2b2b"/>
      <stop offset="1" stop-color="#061a1a"/>
    </linearGradient>
    <linearGradient id="hud-board" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#123c37"/>
      <stop offset="1" stop-color="#0d2b28"/>
    </linearGradient>
    <linearGradient id="hud-band" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b6e07a"/>
      <stop offset="1" stop-color="#f5a81c"/>
    </linearGradient>
    <linearGradient id="hud-centre" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f5a81c"/>
      <stop offset="1" stop-color="#e63b2e"/>
    </linearGradient>
    <linearGradient id="hud-drop" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9d6bff"/>
      <stop offset="1" stop-color="#e63b2e"/>
    </linearGradient>
    <linearGradient id="hud-sweep" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b6e07a" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#b6e07a" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#b6e07a" stop-opacity="0"/>
    </linearGradient>
    <filter id="hud-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="hud-soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="640" fill="url(#hud-bg)"/>
  <g opacity="0.09" fill="#b6e07a">
    <rect x="0" y="0" width="1200" height="1"/>
    <rect x="0" y="80" width="1200" height="1"/>
    <rect x="0" y="160" width="1200" height="1"/>
    <rect x="0" y="240" width="1200" height="1"/>
    <rect x="0" y="320" width="1200" height="1"/>
    <rect x="0" y="400" width="1200" height="1"/>
    <rect x="0" y="480" width="1200" height="1"/>
    <rect x="0" y="560" width="1200" height="1"/>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <text x="48" y="58" fill="#f4e3c2" font-size="27" font-weight="700">planHud()</text>
    <text x="48" y="84" fill="#8fd0b8" font-size="15">mỗi readout = một BĂNG glyph · y = baseline − 0.72·size · h = 0.97·size</text>

    <!-- ................................ board ................................ -->
    <g transform="translate(48 108)">
      <rect width="700" height="486" rx="16" fill="url(#hud-board)" stroke="#1d5c52" stroke-width="1.5"/>
      <text x="18" y="28" fill="#8fd0b8" font-size="13">bàn chơi 1280×720 · s = 1.029 · combo 34px + 3 chip → đáy 255px</text>

      <!-- sweep line -->
      <rect x="0" y="0" width="700" height="30" fill="url(#hud-sweep)">
        <animate attributeName="y" values="40;470;40" dur="7s" repeatCount="indefinite"/>
      </rect>

      <!-- left column bands -->
      <g>
        <g>
          <rect x="18" y="46" width="150" height="26" rx="6" fill="url(#hud-band)" opacity="0.9"/>
          <text x="26" y="64" fill="#06211d" font-size="13" font-weight="700">ĐIỂM 1 240</text>
          <animate attributeName="opacity" values="0;1;1" keyTimes="0;0.25;1" dur="6s" repeatCount="indefinite"/>
        </g>
        <g>
          <rect x="18" y="86" width="126" height="22" rx="6" fill="#2f7d6a" opacity="0.85"/>
          <text x="26" y="102" fill="#d8f5e4" font-size="12">KỶ LỤC 980</text>
          <animate attributeName="opacity" values="0;1;1" keyTimes="0;0.35;1" dur="6s" repeatCount="indefinite"/>
        </g>
        <g>
          <rect x="18" y="122" width="196" height="24" rx="6" fill="#1e5f52"/>
          <rect x="18" y="122" width="150" height="24" rx="6" fill="#b6e07a" opacity="0.85">
            <animate attributeName="width" values="150;96;150" dur="5s" repeatCount="indefinite"/>
          </rect>
          <text x="26" y="139" fill="#06211d" font-size="12" font-weight="700">ĐỘ BỀN</text>
          <animate attributeName="opacity" values="0;1;1" keyTimes="0;0.45;1" dur="6s" repeatCount="indefinite"/>
        </g>
        <g>
          <g fill="#e63b2e">
            <rect x="18" y="160" width="14" height="14" rx="3"/>
            <rect x="38" y="160" width="14" height="14" rx="3"/>
            <rect x="58" y="160" width="14" height="14" rx="3" opacity="0.35"/>
          </g>
          <text x="82" y="172" fill="#f7c9c2" font-size="12">vết nứt 2/3</text>
          <animate attributeName="opacity" values="0;1;1" keyTimes="0;0.55;1" dur="6s" repeatCount="indefinite"/>
        </g>
      </g>

      <!-- right column bands -->
      <g>
        <g>
          <rect x="556" y="42" width="122" height="24" rx="6" fill="#2f7d6a"/>
          <text x="566" y="59" fill="#d8f5e4" font-size="12">CẤP 7</text>
          <animate attributeName="opacity" values="0;1;1" keyTimes="0;0.3;1" dur="6s" repeatCount="indefinite"/>
        </g>
        <g>
          <rect x="556" y="80" width="122" height="24" rx="6" fill="#2f7d6a"/>
          <text x="566" y="97" fill="#d8f5e4" font-size="12">LỌ 5/9</text>
          <animate attributeName="opacity" values="0;1;1" keyTimes="0;0.4;1" dur="6s" repeatCount="indefinite"/>
        </g>
        <g>
          <rect x="556" y="118" width="122" height="24" rx="6" fill="#1e5f52"/>
          <rect x="556" y="118" width="74" height="24" rx="6" fill="#f5a81c" opacity="0.9">
            <animate attributeName="width" values="74;118;74" dur="6s" repeatCount="indefinite"/>
          </rect>
          <text x="566" y="135" fill="#06211d" font-size="12" font-weight="700">ĐẦY 62%</text>
          <animate attributeName="opacity" values="0;1;1" keyTimes="0;0.5;1" dur="6s" repeatCount="indefinite"/>
        </g>
        <g>
          <rect x="556" y="156" width="122" height="24" rx="6" fill="#2f7d6a" filter="url(#hud-soft)"/>
          <text x="566" y="173" fill="#d8f5e4" font-size="12">00:42</text>
          <animate attributeName="opacity" values="0;1;1" keyTimes="0;0.6;1" dur="6s" repeatCount="indefinite"/>
        </g>
      </g>

      <!-- flowing centre column -->
      <g filter="url(#hud-glow)">
        <text x="350" y="120" fill="#f5a81c" font-size="46" font-weight="800" text-anchor="middle">×24</text>
        <animate attributeName="opacity" values="0;1;1" keyTimes="0;0.5;1" dur="6s" repeatCount="indefinite"/>
      </g>
      <g>
        <rect x="286" y="132" width="128" height="7" rx="3.5" fill="#1e5f52"/>
        <rect x="286" y="132" width="104" height="7" rx="3.5" fill="url(#hud-centre)">
          <animate attributeName="width" values="104;24;104" dur="4s" repeatCount="indefinite"/>
        </rect>
        <text x="350" y="160" fill="#8fd0b8" font-size="11" text-anchor="middle">thanh combo — DƯỚI hộp glyph</text>
      </g>
      <g>
        <rect x="300" y="176" width="100" height="22" rx="6" fill="#9d6bff" opacity="0.85"/>
        <text x="350" y="192" fill="#0b1730" font-size="12" font-weight="700" text-anchor="middle">×3 MULT</text>
      </g>
      <!-- chips xếp CHỒNG theo chipStep, không nằm ngang -->
      <g>
        <rect x="228" y="204" width="142" height="22" rx="6" fill="#1e5f52" stroke="#b6e07a" stroke-width="1"/>
        <text x="238" y="220" fill="#d8f5e4" font-size="11">chip · MÙA VÀNG</text>
        <rect x="228" y="228" width="142" height="22" rx="6" fill="#1e5f52" stroke="#b6e07a" stroke-width="1"/>
        <text x="238" y="244" fill="#d8f5e4" font-size="11">chip · ỚT LỬA</text>
        <rect x="228" y="252" width="142" height="22" rx="6" fill="#1e5f52" stroke="#b6e07a" stroke-width="1"/>
        <text x="238" y="268" fill="#d8f5e4" font-size="11">chip · GỐM MỎNG</text>
      </g>

      <!-- flow arrows -->
      <g stroke="#b6e07a" stroke-width="1.6" fill="none" opacity="0.75">
        <path d="M350 168 L350 176"/>
        <path d="M350 200 L350 204"/>
        <path d="M350 274 L350 290"/>
      </g>
      <text x="350" y="306" fill="#b6e07a" font-size="12" text-anchor="middle">cột giữa CHẢY từ clockY — không neo tuyệt đối</text>

      <text x="350" y="344" fill="#f4e3c2" font-size="15" text-anchor="middle">đáy HUD: 255px / 720px</text>
      <rect x="150" y="356" width="400" height="10" rx="5" fill="#123c37"/>
      <rect x="150" y="356" width="141" height="10" rx="5" fill="#b6e07a" opacity="0.9">
        <animate attributeName="width" values="141;120;141" dur="5s" repeatCount="indefinite"/>
      </rect>
      <text x="350" y="384" fill="#8fd0b8" font-size="12" text-anchor="middle">255px — còn 465px bàn chơi trống</text>

      <g opacity="0.9">
        <rect x="150" y="404" width="400" height="46" rx="10" fill="#0f332e" stroke="#2f7d6a"/>
        <text x="350" y="424" fill="#f4e3c2" font-size="12" text-anchor="middle">traceHud().collisions = []</text>
        <text x="350" y="442" fill="#8fd0b8" font-size="11" text-anchor="middle">0 cặp chồng lấn trên mọi bàn chơi được</text>
      </g>
    </g>

    <!-- ................................ drop ladder ................................ -->
    <g transform="translate(784 108)">
      <text x="0" y="18" fill="#f4e3c2" font-size="16" font-weight="700">bậc thang bỏ dần</text>
      <text x="0" y="40" fill="#8fd0b8" font-size="12">bỏ thứ ít thông tin nhất trước</text>

      <g font-size="13">
        <g transform="translate(0 60)">
          <rect width="368" height="46" rx="10" fill="#0f332e" stroke="url(#hud-drop)" stroke-width="1.6"/>
          <text x="16" y="29" fill="#d8f5e4">chips</text>
          <text x="200" y="29" fill="#f7c9c2">bỏ đầu tiên</text>
          <rect x="16" y="34" width="60" height="2" fill="#e63b2e">
            <animate attributeName="width" values="0;0;336;336" keyTimes="0;0.1;0.4;1" dur="8s" repeatCount="indefinite"/>
          </rect>
        </g>
        <g transform="translate(0 118)">
          <rect width="368" height="46" rx="10" fill="#0f332e" stroke="url(#hud-drop)" stroke-width="1.6"/>
          <text x="16" y="29" fill="#d8f5e4">comboBar</text>
          <text x="200" y="29" fill="#f5d9a8">bỏ thứ hai</text>
          <rect x="16" y="34" width="60" height="2" fill="#e63b2e">
            <animate attributeName="width" values="0;0;336;336" keyTimes="0;0.25;0.55;1" dur="8s" repeatCount="indefinite"/>
          </rect>
        </g>
        <g transform="translate(0 176)">
          <rect width="368" height="46" rx="10" fill="#0f332e" stroke="url(#hud-drop)" stroke-width="1.6"/>
          <text x="16" y="29" fill="#d8f5e4">jars</text>
          <text x="200" y="29" fill="#a9e6c9">bỏ thứ ba</text>
          <rect x="16" y="34" width="60" height="2" fill="#e63b2e">
            <animate attributeName="width" values="0;0;336;336" keyTimes="0;0.4;0.7;1" dur="8s" repeatCount="indefinite"/>
          </rect>
        </g>
        <g transform="translate(0 234)">
          <rect width="368" height="46" rx="10" fill="#0f332e" stroke="url(#hud-drop)" stroke-width="1.6"/>
          <text x="16" y="29" fill="#d8f5e4">best</text>
          <text x="200" y="29" fill="#cfe9d8">bỏ cuối cùng</text>
          <rect x="16" y="34" width="60" height="2" fill="#e63b2e">
            <animate attributeName="width" values="0;0;336;336" keyTimes="0;0.55;0.85;1" dur="8s" repeatCount="indefinite"/>
          </rect>
        </g>
      </g>

      <text x="0" y="316" fill="#f4e3c2" font-size="16" font-weight="700">rồi nén</text>
      <text x="0" y="338" fill="#8fd0b8" font-size="12">s: 1.029 · bước 0.02 · sàn 0.55</text>

      <g>
        <rect x="0" y="352" width="368" height="18" rx="9" fill="#123c37"/>
        <rect x="0" y="352" width="368" height="18" rx="9" fill="url(#hud-band)">
          <animate attributeName="width" values="368;197;368" dur="6s" repeatCount="indefinite"/>
        </rect>
        <g fill="#06211d" font-size="11" font-weight="700">
          <text x="8" y="365">1.029</text>
          <text x="330" y="365">0.55</text>
        </g>
      </g>

      <g transform="translate(0 396)">
        <rect width="368" height="76" rx="10" fill="#0f332e" stroke="#2f7d6a"/>
        <text x="14" y="26" fill="#f4e3c2" font-size="12">dưới playable() (240×320)</text>
        <text x="14" y="46" fill="#f7c9c2" font-size="11" font-family="ui-monospace, monospace">stamina/fill · stamina/clock · fill/clock</text>
        <text x="14" y="64" fill="#8fd0b8" font-size="11">vẫn chồng lấn — và được BÁO, không giấu</text>
      </g>
    </g>
  </g>

  <g transform="translate(48 616)">
    <rect width="1104" height="1" fill="#1d5c52"/>
    <text x="0" y="18" fill="#8fd0b8" font-size="11" font-family="ui-monospace, monospace">Lọ Chéo v1.1.8 · vòng 9 · src/game/adaptive/hud.ts · tests/hud-plan.test.ts (17)</text>
  </g>
</svg>
