<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" role="img" aria-label="Dải hai pixel và đường kéo — v1.1.8 vòng 16: sáu lý do giữ bậc, lỗi still từng giữ bản sửa vĩnh viễn, và báo cáo đường kéo đo 4 600 cửa sổ: rung 1px đổi bậc 48 lần khi không có dải và 0 lần khi có (hoạt họa SMIL)">
  <defs>
    <linearGradient id="ahBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#07201e"/>
      <stop offset="0.6" stop-color="#0b2b2b"/>
      <stop offset="1" stop-color="#061a1a"/>
    </linearGradient>
    <linearGradient id="ahCard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17494a"/>
      <stop offset="1" stop-color="#0d3536"/>
    </linearGradient>
    <linearGradient id="ahJade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b6e07a"/>
      <stop offset="1" stop-color="#6fcf9b"/>
    </linearGradient>
    <linearGradient id="ahGold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f5a81c"/>
      <stop offset="1" stop-color="#ffd166"/>
    </linearGradient>
    <linearGradient id="ahChili" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e63b2e"/>
      <stop offset="1" stop-color="#f2775f"/>
    </linearGradient>
    <filter id="ahGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="470" fill="url(#ahBg)"/>

  <text x="44" y="48" fill="#f4e3c2" font-family="Bungee, Verdana, sans-serif" font-size="23" letter-spacing="1.1">DẢI 2PX &amp; ĐƯỜNG KÉO</text>
  <text x="44" y="72" fill="#7fae95" font-family="Verdana, sans-serif" font-size="12">v1.1.8 · vòng 16 — sáu lý do thay một boolean, một lỗi sống, và audit đi theo đường</text>
  <line x1="44" y1="88" x2="1156" y2="88" stroke="#1c4a49" stroke-width="1.5"/>

  <!-- ============ A · six verdicts ============ -->
  <g>
    <rect x="44" y="104" width="356" height="272" rx="12" fill="url(#ahCard)" stroke="#1f5b5a" stroke-width="1.5"/>
    <text x="62" y="130" fill="#f5a81c" font-family="Verdana, sans-serif" font-size="12.5" font-weight="bold" letter-spacing="0.6">SÁU LÝ DO — explainHold()</text>
    <text x="62" y="150" fill="#8fb7a8" font-family="Verdana, sans-serif" font-size="10">shouldHold() chỉ còn là một lần đọc verdict</text>

    <!-- verdict rows: label · keep? -->
    <g font-family="Verdana, sans-serif" font-size="11">
      <rect x="60" y="164" width="324" height="26" rx="6" fill="#0e3a3a" stroke="#24605e"/>
      <text x="72" y="182" fill="#b6e07a">first-frame</text><text x="300" y="182" fill="#8fb7a8">áp</text>

      <rect x="60" y="196" width="324" height="26" rx="6" fill="#0e3a3a" stroke="#24605e"/>
      <text x="72" y="214" fill="#b6e07a">no-band</text><text x="300" y="214" fill="#8fb7a8">áp</text>

      <rect x="60" y="228" width="324" height="26" rx="6" fill="#0e3a3a" stroke="#24605e"/>
      <text x="72" y="246" fill="#b6e07a">same-rung</text><text x="300" y="246" fill="#8fb7a8">áp</text>

      <!-- the bug: `still` used to hold forever -->
      <rect x="60" y="260" width="324" height="26" rx="6" fill="#3a1e14" stroke="#e63b2e">
        <animate attributeName="opacity" values="1;0.55;1" dur="3.2s" repeatCount="indefinite"/>
      </rect>
      <text x="72" y="278" fill="#f2775f">still  ← bản sửa, lever, inset</text><text x="286" y="278" fill="#f2775f">áp</text>

      <rect x="60" y="292" width="324" height="26" rx="6" fill="#0e3a3a" stroke="#24605e"/>
      <text x="72" y="310" fill="#b6e07a">jump</text><text x="300" y="310" fill="#8fb7a8">áp</text>

      <rect x="60" y="324" width="324" height="26" rx="6" fill="#123b34" stroke="#6fcf9b"/>
      <text x="72" y="342" fill="#f5a81c">held</text><text x="66" y="342" fill="#f5a81c"/>
      <text x="292" y="342" fill="#6fcf9b">giữ</text>
      <circle cx="330" cy="337" r="4" fill="#6fcf9b">
        <animate attributeName="r" values="3;5.5;3" dur="2.6s" repeatCount="indefinite"/>
      </circle>
    </g>

    <text x="62" y="366" fill="#7fae95" font-family="Verdana, sans-serif" font-size="9.5">.held → data-adaptive-held · diagnose() lớp 12</text>
  </g>

  <!-- ============ B · the band ============ -->
  <g>
    <rect x="416" y="104" width="356" height="272" rx="12" fill="url(#ahCard)" stroke="#1f5b5a" stroke-width="1.5"/>
    <text x="434" y="130" fill="#f5a81c" font-family="Verdana, sans-serif" font-size="12.5" font-weight="bold" letter-spacing="0.6">DẢI ±2PX</text>
    <text x="434" y="150" fill="#8fb7a8" font-family="Verdana, sans-serif" font-size="10">cửa sổ nhích 1px quanh ranh giới</text>

    <!-- axis line -->
    <line x1="444" y1="228" x2="744" y2="228" stroke="#275f5e" stroke-width="2"/>
    <!-- the band -->
    <rect x="578" y="196" width="32" height="64" rx="6" fill="#123b34" stroke="#6fcf9b" stroke-width="1.4">
      <animate attributeName="opacity" values="0.85;0.45;0.85" dur="3s" repeatCount="indefinite"/>
    </rect>
    <!-- boundary -->
    <line x1="594" y1="188" x2="594" y2="268" stroke="#f5a81c" stroke-width="2.5" stroke-dasharray="5 4">
      <animate attributeName="stroke-dashoffset" values="0;18" dur="2.4s" repeatCount="indefinite"/>
    </line>
    <text x="566" y="184" fill="#f5a81c" font-family="Verdana, sans-serif" font-size="10">ranh giới</text>
    <text x="536" y="284" fill="#6fcf9b" font-family="Verdana, sans-serif" font-size="9.5">−2px</text>
    <text x="616" y="284" fill="#6fcf9b" font-family="Verdana, sans-serif" font-size="9.5">+2px</text>

    <!-- jitter dots shaking inside the band -->
    <g>
      <circle cx="584" cy="228" r="5" fill="url(#ahJade)">
        <animate attributeName="cx" values="584;604;584" dur="1.6s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="214;242;214" dur="1.3s" repeatCount="indefinite"/>
      </circle>
      <circle cx="604" cy="228" r="3.4" fill="#f5a81c" opacity="0.85">
        <animate attributeName="cx" values="604;584;604" dur="1.6s" begin="0.2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.85;0.3;0.85" dur="1.9s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- the two directions -->
    <text x="444" y="316" fill="#8fb7a8" font-family="Verdana, sans-serif" font-size="10">nhích trong dải → giữ bậc cũ</text>
    <text x="444" y="336" fill="#6fcf9b" font-family="Verdana, sans-serif" font-size="10">quá 2px → áp bậc mới, ngay khung đó</text>
    <text x="444" y="358" fill="#f2775f" font-family="Verdana, sans-serif" font-size="10">giữ quá margin + 1 khung = latched → 0</text>
  </g>

  <!-- ============ C · the drag audit ============ -->
  <g>
    <rect x="788" y="104" width="368" height="272" rx="12" fill="url(#ahCard)" stroke="#1f5b5a" stroke-width="1.5"/>
    <text x="806" y="130" fill="#f5a81c" font-family="Verdana, sans-serif" font-size="12.5" font-weight="bold" letter-spacing="0.6">ĐƯỜNG KÉO — 4 600 CỬA SỔ</text>
    <text x="806" y="150" fill="#8fb7a8" font-family="Verdana, sans-serif" font-size="10">21 preset × 241 bước 1px, hai lần chạy</text>

    <!-- sweep -->
    <text x="806" y="182" fill="#f4e3c2" font-family="Verdana, sans-serif" font-size="11">sweep — kéo một chiều</text>
    <rect x="806" y="190" width="300" height="12" rx="6" fill="#0b2b2b" stroke="#24605e"/>
    <rect x="806" y="190" width="290" height="12" rx="6" fill="url(#ahGold)">
      <animate attributeName="width" values="0;290;290" dur="3.4s" repeatCount="indefinite"/>
    </rect>
    <text x="1116" y="201" fill="#ffd166" font-family="Verdana, sans-serif" font-size="10.5">12 → 11</text>

    <!-- shake -->
    <text x="806" y="230" fill="#f4e3c2" font-family="Verdana, sans-serif" font-size="11">shake — con trỏ rung 1px</text>
    <rect x="806" y="238" width="300" height="12" rx="6" fill="#0b2b2b" stroke="#24605e"/>
    <rect x="806" y="238" width="290" height="12" rx="6" fill="url(#ahChili)">
      <animate attributeName="width" values="290;290;0" dur="3.4s" repeatCount="indefinite"/>
    </rect>
    <text x="1116" y="249" fill="#f2775f" font-family="Verdana, sans-serif" font-size="10.5">48 → 0</text>

    <!-- the three properties -->
    <g font-family="Verdana, sans-serif" font-size="10">
      <text x="806" y="286" fill="#b6e07a">an toàn</text><text x="878" y="286" fill="#8fb7a8">0 vi phạm hợp đồng trên mọi profile được vẽ</text>
      <text x="806" y="308" fill="#b6e07a">sống</text><text x="878" y="308" fill="#8fb7a8">không lần giữ nào dài quá margin + 1 khung</text>
      <text x="806" y="330" fill="#b6e07a">biên</text><text x="878" y="330" fill="#8fb7a8">worstLag 2px — đúng bằng HYSTERESIS_MARGIN</text>
    </g>
    <text x="806" y="358" fill="#7fae95" font-family="Verdana, sans-serif" font-size="9.5">docs/adaptive-drag.md — sinh tự động, có --check</text>
  </g>

  <line x1="44" y1="394" x2="1156" y2="394" stroke="#1c4a49" stroke-width="1.5"/>
  <text x="44" y="420" fill="#b6e07a" font-family="Verdana, sans-serif" font-size="11">15 bất biến · 578 cửa sổ audit · 4 600 cửa sổ kéo · 12 ranh giới · lag 2px · 1518 test / 142 file</text>
  <text x="44" y="442" fill="#7fae95" font-family="Verdana, sans-serif" font-size="10">mười sáu vòng: bậc thang vẫn là bậc thang — nhưng từ nay nó nói được vì sao nó đứng yên</text>
</svg>
