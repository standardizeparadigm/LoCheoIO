name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Typecheck · tests · build (Node 22)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck + unit tests + single-file build
        run: npm run check

      - name: SSR render smoke (menu/modal tree)
        run: npm run smoke

  readme-sync:
    name: README sync (10 locales)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify version badge · release link · corner-menu embed · historical rows
        run: node scripts/check-readme-sync.mjs

      - name: Assets referenced ↔ exists (no orphans)
        run: node scripts/check-assets.mjs

      # The tests badge is checked by `docs-numbers.test.ts`, which reads the JSON
      # report this script writes. CI ran neither: `npm run check` is
      # `tsc && vitest run && vite build`, so `check:readme` — the only thing that
      # invokes `--verify` — was never called, and the badge could drift by any
      # amount while every job stayed green. `--verify` runs the suite, reads the
      # report and exits non-zero on a stale badge in any of the ten READMEs.
      - name: Tests badge matches the suite (runs it, ~40 s)
        run: node scripts/sync-test-badge.mjs --verify

      - name: i18n parity (7 locales, key count printed by the script)
        run: node scripts/check-i18n.mjs
